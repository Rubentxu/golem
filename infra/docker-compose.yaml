# Golem Infrastructure — Docker Compose
#
# Benchmark gate infrastructure for ADR-086.
# Portable across Linux, Windows (WSL2), Mac.
#
# Usage:
#   docker compose up -d           # start all services
#   docker compose up -d nats      # start specific service
#   docker compose down            # stop all
#   docker compose ps              # show status
#   docker compose logs nats -f   # tail logs
#
# Health checks are automatic (see each service's healthcheck).
# Benchmark:
#   python3 -m infra.bench.run hugegraph http://localhost:8080 --tck

services:

  nats:
    build:
      context: nats
      dockerfile: Containerfile
    image: golem-nats:latest
    container_name: golem-nats
    ports:
      - "4222:4222"   # client
      - "8222:8222"   # monitoring
      - "6222:6222"   # cluster
    volumes:
      - nats-data:/data
      - ./nats/nats-server.conf:/etc/nats/nats-server.conf:ro
    healthcheck:
      test: ["CMD", "nats-server", "-c", "/etc/nats/nats-server.conf", "--ping"]
      interval: 30s
      retries: 3
      timeout: 10s
    restart: unless-stopped

  hugegraph:
    build:
      context: hugegraph
      dockerfile: Containerfile
    image: golem-hugegraph:latest
    container_name: golem-hugegraph
    ports:
      - "8080:8080"   # Gremlin HTTP
      - "8090:8090"   # HugeStudio
      - "8081:8081"   # HBase
    volumes:
      - hugegraph-data:/opt/hugegraph
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/graphs/hugegraph"]
      interval: 30s
      retries: 5
      timeout: 15s
    restart: unless-stopped

  dgraph:
    build:
      context: dgraph
      dockerfile: Containerfile
    image: golem-dgraph:latest
    container_name: golem-dgraph
    command: dgraph alpha --bindall=true --encryption=false --zero=localhost:5080
    ports:
      - "8080:8080"   # HTTP admin
      - "9080:9080"   # gRPC
      - "8000:8000"   # Ratel UI
    volumes:
      - dgraph-data:/dgraph
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 30s
      retries: 5
      timeout: 15s
    restart: unless-stopped
    depends_on:
      - dgraph-zero

  dgraph-zero:
    image: docker.io/dgraph/dgraph:latest
    container_name: golem-dgraph-zero
    command: dgraph zero --bindall=true --port 5080
    ports:
      - "6080:6080"
    volumes:
      - dgraph-zero-data:/dgraph
    restart: unless-stopped

  nebula-allinone:
    build:
      context: nebula
      dockerfile: Containerfile
    image: golem-nebula:latest
    container_name: golem-nebula
    ports:
      - "9669:9669"    # nGQL client
      - "19669:19669"  # HTTP console
      - "9559:9559"    # metad thrift
      - "9560:9560"    # storaged thrift
    volumes:
      - nebula-data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:19669/status"]
      interval: 30s
      retries: 5
      timeout: 15s
    restart: unless-stopped

volumes:
  nats-data:
  hugegraph-data:
  dgraph-data:
  dgraph-zero-data:
  nebula-data:
